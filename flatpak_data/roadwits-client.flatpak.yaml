app-id: com.roadwits.client
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: roadwits-client

# appstream-compose: true (по умолчанию) — flatpak-builder сам зовёт
# `appstreamcli compose` на ХОСТЕ раннера и кладёт составленные
# appstream-метаданные + иконку в экспортируемое дерево, откуда их
# потом подхватывает `flatpak build-update-repo`, формируя ветку
# appstream/ARCH (по ней `flatpak update`/`flatpak list` показывают
# версию и описание). Работает только с flatpak-builder >= 1.4 —
# в apt на ubuntu-22.04 версия 1.2.2, которая ещё пытается звать
# старый бинарь appstream-compose, убранный из SDK начиная с GNOME 47+,
# и падает с "bwrap: execvp appstream-compose: No such file or
# directory". Поэтому в CI (см. release.yml, шаг "Install Flatpak")
# flatpak и flatpak-builder ставятся не из apt, а из ppa:flatpak/stable.

finish-args:
  - '--share=ipc'
  - '--socket=x11'
  - '--socket=wayland'
  - '--device=dri'
  - '--share=network'
  - '--filesystem=home'
  - '--filesystem=xdg-config'
  - '--filesystem=xdg-data'
  - '--talk-name=org.freedesktop.Notifications'
  # Позволяет звать flatpak-spawn --host изнутри песочницы (доступ к порталу
  # org.freedesktop.Flatpak) — только так приложение может само запустить
  # "flatpak update" на хосте и перезапустить себя уже обновлённым (см.
  # flatpak_update_and_restart в src-tauri/src/lib.rs); без /app сама
  # песочница на чтение-только и обновить себя изнутри не может.
  - '--talk-name=org.freedesktop.Flatpak'

modules:
  - name: roadwits-client
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      build-args:
        - '--share=network'
    build-commands:
      - npm ci --legacy-peer-deps                 
      - npx tauri build --no-bundle
      - install -Dm755 src-tauri/target/release/roadwits-client /app/bin/roadwits-client
    sources:
      - type: dir
        path: ..                                  # корень репозитория (манифест теперь в flatpak_data/)

  - name: assets
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/icons/hicolor/128x128/apps
      - mkdir -p /app/share/icons/hicolor/256x256/apps
      - mkdir -p /app/share/applications
      - mkdir -p /app/share/metainfo
      # 128x128.png и 256x256.png ниже — реальные пиксельные размеры файлов
      # (128x128@2x.png у Tauri на самом деле 256×256), а не просто их имена.
      # Это важно: appstreamcli compose при сборке appstream-каталога
      # сверяет фактический размер иконки с именем hicolor-папки, и при
      # несовпадении может выкинуть компонент из каталога целиком —
      # тогда `flatpak update`/`flatpak list` не покажут вообще никакой
      # метаинформации (ни версию, ни скриншоты), не только иконку.
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/com.roadwits.client.png
      - install -Dm644 256x256.png /app/share/icons/hicolor/256x256/apps/com.roadwits.client.png
      - install -Dm644 roadwits-client.desktop /app/share/applications/com.roadwits.client.desktop
      - install -Dm644 com.roadwits.client.metainfo.xml /app/share/metainfo/com.roadwits.client.metainfo.xml
    sources:
      - type: file
        path: roadwits-client.desktop
      - type: file
        path: ../src-tauri/icons/128x128.png
        dest-filename: 128x128.png
      - type: file
        path: ../src-tauri/icons/128x128@2x.png    # физически 256×256 px
        dest-filename: 256x256.png
      - type: file
        path: com.roadwits.client.metainfo.xml

