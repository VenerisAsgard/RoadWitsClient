app-id: com.roadwits.client
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: roadwits-client

# appstream-compose (встроенный шаг flatpak-builder, дёргающий бинарь
# appstream-compose из SDK) не используем: его убрали из SDK начиная с
# GNOME 47+. Метаданные всё равно нужны (иначе `flatpak update` пишет
# "No such ref 'appstream.../x86_64'" и `flatpak list` не показывает
# версию) — поэтому composed через `appstreamcli compose` на ХОСТЕ
# раннера (пакет appstream, ставится в CI), отдельным шагом
# `flatpak build-update-repo --appstream-compose` после сборки — см.
# release.yml, джоба release-flatpak. metainfo.xml для этого лежит
# рядом (com.roadwits.client.metainfo.xml) и ставится в assets ниже.
appstream-compose: false

finish-args:
  - '--share=ipc'
  - '--socket=x11'
  - '--socket=wayland'
  - '--device=dri'
  - '--share=network'
  - '--filesystem=home'
  - '--filesystem=xdg-config'
  - '--filesystem=xdg-data'
  - '--talk-name=org.freedesktop.Notifications'

modules:
  - name: roadwits-client
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      build-args:
        - '--share=network'
    build-commands:
      - npm ci --legacy-peer-deps                 # npm в корне (package.json там)
      - cd src-tauri && cargo build --release --bin roadwits-client  # cargo в src-tauri
      - install -Dm755 src-tauri/target/release/roadwits-client /app/bin/roadwits-client
    sources:
      - type: dir
        path: ..                                  # корень репозитория (манифест теперь в flatpak_data/)

  - name: assets
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/icons/hicolor/256x256/apps
      - mkdir -p /app/share/applications
      - mkdir -p /app/share/metainfo
      - install -Dm644 128x128.png /app/share/icons/hicolor/256x256/apps/com.roadwits.client.png
      - install -Dm644 roadwits-client.desktop /app/share/applications/com.roadwits.client.desktop
      - install -Dm644 com.roadwits.client.metainfo.xml /app/share/metainfo/com.roadwits.client.metainfo.xml
    sources:
      - type: file
        path: roadwits-client.desktop
      - type: file
        path: ../src-tauri/icons/128x128.png
        dest-filename: 128x128.png
      - type: file
        path: com.roadwits.client.metainfo.xml

