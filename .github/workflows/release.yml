name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # --- Стандартные сборки Tauri (macOS, Windows). Linux — только через
  # Flatpak (см. job release-flatpak ниже): bundle.targets в
  # tauri.conf.json ("nsis", "app", "dmg") под Linux всё равно ничего не
  # даёт, а сборка deb/rpm/appimage тут раньше приводила к дублированию
  # артефактов (Roadwits_* vs roadwits_*, из-за расхождения productName
  # и имени Cargo-пакета) и ошибке "No artifacts were found" в tauri-action.
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install frontend deps
        run: |
          npm install -g npm@10.9.2
          npm ci --legacy-peer-deps

      - name: build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "Roadwits ${{ github.ref_name }}"
          releaseBody: "Автоматическая сборка из тега ${{ github.ref_name }}. Полный список изменений — в истории коммитов."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # --- Сборка Flatpak (для Arch / Wayland / EGL_BAD_ALLOC) ---
  release-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-22.04
    needs: release   # ждём, пока tauri-action создаст черновик релиза
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak & flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Sdk//50 org.gnome.Platform//50 org.freedesktop.Sdk.Extension.rust-stable//25.08 org.freedesktop.Sdk.Extension.node22//25.08

      - name: Build Flatpak bundle
        run: |
          mkdir build-dir
          # манифест теперь лежит в flatpak_data/
          flatpak-builder --force-clean --user --repo=repo build-dir flatpak_data/roadwits-client.flatpak.yaml
          flatpak build-bundle repo com.roadwits.client.flatpak com.roadwits.client

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v6
        with:
          name: roadwits-client-flatpak
          path: com.roadwits.client.flatpak

      - name: Attach Flatpak to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" com.roadwits.client.flatpak --clobber
