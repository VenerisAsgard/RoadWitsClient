name: Release

on:
  push:
    tags:
      - "v*"
  # Ручной запуск (кнопка "Run workflow" на вкладке Actions → Release).
  # Полезно, когда пуш тега по какой-то причине не создаёт автозапуск —
  # см. обсуждение выше. ВАЖНО: "Use workflow from" в диалоге запуска
  # выбирает, ИЗ КАКОЙ ВЕТКИ/ТЕГА брать код (checkout) — это отдельная
  # настройка, а поле tag ниже только задаёт имя тега/релиза, который
  # соберёт tauri-action. Если тега с таким именем ещё не существует на
  # GitHub, он будет создан автоматически и указывать на выбранную ветку.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Версия релиза, например v1.1.27 (без тега — просто соберёт под этим именем)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # --- Стандартные сборки Tauri (macOS, Windows). Linux — только через
  # Flatpak (см. job release-flatpak ниже): bundle.targets в
  # tauri.conf.json ("nsis", "app", "dmg") под Linux всё равно ничего не
  # даёт, а сборка deb/rpm/appimage тут раньше приводила к дублированию
  # артефактов (Roadwits_* vs roadwits_*, из-за расхождения productName
  # и имени Cargo-пакета) и ошибке "No artifacts were found" в tauri-action.
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install frontend deps
        run: |
          npm install -g npm@10.9.2
          npm ci --legacy-peer-deps

      - name: build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Roadwits ${{ inputs.tag || github.ref_name }}"
          releaseBody: "Автоматическая сборка из тега ${{ inputs.tag || github.ref_name }}. Полный список изменений — в истории коммитов."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # --- Сборка Flatpak (для Arch / Wayland / EGL_BAD_ALLOC) ---
  # Идёт параллельно с job'ой release (macOS/Windows) — технологически
  # с ней не связана, ждать нечего. Единственное место, где нужен уже
  # созданный tauri-action'ом черновик релиза — последний шаг (upload),
  # поэтому ждём именно там, коротким поллингом, а не всей job'ой.
  release-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-22.04
    # Каждый пуш в gh-pages (шаг "Publish OSTree repo" ниже) запускает
    # СКРЫТЫЙ системный workflow GitHub "pages build and deployment" —
    # его самого в этом файле нет, но именно он висит в статусе
    # "deployment_queued" и в итоге ловит таймаут в логах Actions.
    # Причина: у Pages единовременно может идти только один деплой на
    # environment github-pages; если теги пушатся быстро один за другим
    # (см. историю тегов v1.1.20…v1.1.26), новые деплои встают в очередь
    # за предыдущим и виснут, если тот не может завершиться. concurrency
    # здесь не устраняет сам системный workflow (на него мы повлиять не
    # можем), но гарантирует, что НАША job не будет параллельно пытаться
    # запустить второй релиз/пуш в gh-pages поверх ещё не закончившегося —
    # это и есть typical источник таких зависаний.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak & flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Sdk//50 org.gnome.Platform//50 org.freedesktop.Sdk.Extension.rust-stable//25.08 org.freedesktop.Sdk.Extension.node22//25.08

      - name: Build Flatpak bundle
        run: |
          mkdir build-dir
          # манифест теперь лежит в flatpak_data/
          flatpak-builder --force-clean --user --repo=repo build-dir flatpak_data/roadwits-client.flatpak.yaml
          # --repo-url зашивает адрес OSTree-репозитория в сам бандл: после
          # `flatpak install --user *.flatpak` remote добавится сам, и
          # `flatpak update` будет реально знать, где искать новые версии.
          # ВАЖНО: publish_dir: ./repo ниже кладёт содержимое repo/ в КОРЕНЬ
          # ветки gh-pages, поэтому сам репозиторий будет жить в корне сайта
          # (.../RoadWitsClient/), а не в .../RoadWitsClient/repo
          flatpak build-bundle repo com.roadwits.client.flatpak com.roadwits.client \
            --repo-url=https://venerisasgard.github.io/RoadWitsClient/

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v6
        with:
          name: roadwits-client-flatpak
          path: com.roadwits.client.flatpak

      - name: Publish OSTree repo to GitHub Pages
        run: |
          sudo apt-get install -y ostree
          # summary обязателен — по нему flatpak update узнаёт о новых коммитах/версиях
          ostree summary -u --repo=repo
        # gh-pages ветка — статика, которую раздаёт GitHub Pages по URL выше
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          keep_files: false

      - name: Wait for release draft to exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            if gh release view "${{ inputs.tag || github.ref_name }}" >/dev/null 2>&1; then
              echo "Черновик релиза найден"
              exit 0
            fi
            echo "Жду, пока tauri-action создаст черновик релиза... ($i/30)"
            sleep 20
          done
          echo "Черновик релиза так и не появился за 10 минут" >&2
          exit 1

      - name: Attach Flatpak to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag || github.ref_name }}" com.roadwits.client.flatpak --clobber
