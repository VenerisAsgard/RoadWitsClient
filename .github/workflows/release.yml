name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Версия релиза, например v1.1.27 (без тега — просто соберёт под этим именем)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install frontend deps
        run: |
          npm install -g npm@10.9.2
          npm ci --legacy-peer-deps

      - name: build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Roadwits ${{ inputs.tag || github.ref_name }}"
          releaseBody: "Автоматическая сборка из тега ${{ inputs.tag || github.ref_name }}. Полный список изменений — в истории коммитов."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  release-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-22.04
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    env:
      REPO_URL: https://venerisasgard.github.io/RoadWitsClient/
      FLATPAK_GPG_KEY_ID: "73FF792B1A23F54503D8C32A851DA500255C90DA"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install

