name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # --- Стандартные сборки Tauri (macOS, Ubuntu, Windows) ---
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Linux system deps (webkit/gtk)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend deps
        run: |
          npm install -g npm@10.9.2
          npm ci --legacy-peer-deps

      - name: build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "Roadwits ${{ github.ref_name }}"
          releaseBody: "Автоматическая сборка из тега ${{ github.ref_name }}. Полный список изменений — в истории коммитов."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # --- Сборка Flatpak (для Arch / Wayland / EGL_BAD_ALLOC) ---
  release-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-22.04
    # Можно запускать параллельно с release, без зависимости
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak & flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Sdk//25.08 org.freedesktop.Platform//25.08 org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build Flatpak bundle
        run: |
          mkdir build-dir
          # flatpak-builder берёт roadwits-client.flatpak.yaml из корня репозитория
          flatpak-builder --force-clean --user build-dir roadwits-client.flatpak.yaml
          flatpak build-bundle --user build-dir com.roadwits.client.flatpak com.roadwits.client

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: roadwits-client-flatpak
          path: build-dir/com.roadwits.client.flatpak
