name: Release

on:
  push:
    tags:
      - "v*"
  # Ручной запуск (кнопка "Run workflow" на вкладке Actions → Release).
  # Полезно, когда пуш тега по какой-то причине не создаёт автозапуск —
  # см. обсуждение выше. ВАЖНО: "Use workflow from" в диалоге запуска
  # выбирает, ИЗ КАКОЙ ВЕТКИ/ТЕГА брать код (checkout) — это отдельная
  # настройка, а поле tag ниже только задаёт имя тега/релиза, который
  # соберёт tauri-action. Если тега с таким именем ещё не существует на
  # GitHub, он будет создан автоматически и указывать на выбранную ветку.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Версия релиза, например v1.1.27 (без тега — просто соберёт под этим именем)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # --- Стандартные сборки Tauri (macOS, Windows). Linux — только через
  # Flatpak (см. job release-flatpak ниже): bundle.targets в
  # tauri.conf.json ("nsis", "app", "dmg") под Linux всё равно ничего не
  # даёт, а сборка deb/rpm/appimage тут раньше приводила к дублированию
  # артефактов (Roadwits_* vs roadwits_*, из-за расхождения productName
  # и имени Cargo-пакета) и ошибке "No artifacts were found" в tauri-action.
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install frontend deps
        run: |
          npm install -g npm@10.9.2
          npm ci --legacy-peer-deps

      - name: build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Roadwits ${{ inputs.tag || github.ref_name }}"
          releaseBody: "Автоматическая сборка из тега ${{ inputs.tag || github.ref_name }}. Полный список изменений — в истории коммитов."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # --- Сборка Flatpak (для Arch / Wayland / EGL_BAD_ALLOC) ---
  # Идёт параллельно с job'ой release (macOS/Windows) — технологически
  # с ней не связана, ждать нечего. Единственное место, где нужен уже
  # созданный tauri-action'ом черновик релиза — последний шаг (upload),
  # поэтому ждём именно там, коротким поллингом, а не всей job'ой.
  release-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-22.04
    # Каждый пуш в gh-pages (шаг "Publish OSTree repo" ниже) запускает
    # скрытый системный workflow GitHub "pages build and deployment" —
    # именно он мог висеть статусом "deployment_queued" и ловить таймаут.
    # concurrency ниже — "новый релиз важнее старого": если предыдущий
    # запуск этой же job ещё не долетел до Pages (завис/не завершился),
    # GitHub сам отменяет его и сразу пускает актуальный, вместо того
    # чтобы вставать в очередь и ждать вечно (это и было причиной, почему
    # автозапуски переставали появляться/стартовать после первого зависания).
    # Группа общая на все версии (не привязана к тегу) специально: на
    # environment github-pages и так может публиковаться только один
    # деплой одновременно — своя группа на каждый тег просто перенесла бы
    # ту же конкуренцию на сторону самого GitHub Pages.
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    env:
      REPO_URL: https://venerisasgard.github.io/RoadWitsClient/
      # ID ключа не секретный (это публичная информация — публичный ключ и
      # так публикуется в репозитории), секретна только приватная половина
      # в FLATPAK_GPG_PRIVATE_KEY (Settings → Secrets and variables → Actions).
      FLATPAK_GPG_KEY_ID: "73FF792B1A23F54503D8C32A851DA500255C90DA"
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 — нужна полная история и все теги, иначе
          # generate_metainfo.py не увидит прошлые версии для <releases>
          fetch-depth: 0

      - name: Install Flatpak, flatpak-builder & appstream
        run: |
          sudo apt-get update
          # appstream даёт appstreamcli — им compose'им AppStream-каталог
          # на хосте (в SDK начиная с GNOME 47+ этого бинаря больше нет,
          # см. комментарий про appstream-compose: false в манифесте).
          sudo apt-get install -y flatpak flatpak-builder appstream
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Sdk//50 org.gnome.Platform//50 org.freedesktop.Sdk.Extension.rust-stable//25.08 org.freedesktop.Sdk.Extension.node22//25.08

      - name: Import GPG signing key
        run: |
          mkdir -p gpg-homedir && chmod 700 gpg-homedir
          echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | base64 -d | \
            gpg --homedir gpg-homedir --batch --import

      - name: Fill releases & screenshots into metainfo.xml
        # GITHUB_REPOSITORY (owner/repo) уже задан GitHub Actions сам,
        # отдельно передавать не нужно — см. generate_metainfo.py
        run: python3 flatpak_data/generate_metainfo.py

      - name: Build Flatpak bundle
        run: |
          mkdir build-dir
          # манифест теперь лежит в flatpak_data/
          flatpak-builder --force-clean --user \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" --gpg-homedir=gpg-homedir \
            --repo=repo build-dir flatpak_data/roadwits-client.flatpak.yaml

          # Compose AppStream-каталог (appstream/x86_64, appstream2/x86_64)
          # из metainfo.xml, установленного в /app/share/metainfo внутри
          # сборки, плюс пересобирает summary — без этого `flatpak update`
          # ругался "No such ref 'appstream.../x86_64'", а `flatpak list`
          # не показывал версию приложения.
          flatpak build-update-repo --appstream-compose \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" --gpg-homedir=gpg-homedir \
            repo

          # --repo-url зашивает адрес OSTree-репозитория в сам бандл: после
          # `flatpak install --user *.flatpak` remote добавится сам, и
          # `flatpak update` будет реально знать, где искать новые версии.
          # --gpg-sign здесь же встраивает в бандл и публичный ключ, чтобы
          # автодобавленный remote сразу был доверенным (без --no-gpg-verify).
          # ВАЖНО: publish_dir: ./repo ниже кладёт содержимое repo/ в КОРЕНЬ
          # ветки gh-pages, поэтому сам репозиторий будет жить в корне сайта
          # (.../RoadWitsClient/), а не в .../RoadWitsClient/repo
          flatpak build-bundle repo com.roadwits.client.flatpak com.roadwits.client \
            --gpg-sign="$FLATPAK_GPG_KEY_ID" --gpg-homedir=gpg-homedir \
            --repo-url="$REPO_URL"

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v6
        with:
          name: roadwits-client-flatpak
          path: com.roadwits.client.flatpak

      - name: Generate .flatpakrepo file
        run: |
          # Позволяет пользователю добавить remote одной командой, без
          # ручного --no-gpg-verify: публичный ключ зашит тут же (base64
          # сырого, не armored, экспорта), flatpak сам проверит подпись.
          PUBKEY_B64=$(gpg --homedir gpg-homedir --export "$FLATPAK_GPG_KEY_ID" | base64 -w0)
          cat > repo/roadwits-client.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Roadwits Client Updates
          Url=$REPO_URL
          Comment=Обновления клиента Roadwits
          Description=Репозиторий обновлений Tauri-клиента Roadwits
          GPGKey=$PUBKEY_B64
          EOF

      - name: Publish OSTree repo to GitHub Pages
        # summary/appstream уже пересобраны шагом build-update-repo выше —
        # отдельный `ostree summary -u` тут больше не нужен.
        # gh-pages ветка — статика, которую раздаёт GitHub Pages по URL выше
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          keep_files: false

      - name: Wait for release draft to exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            if gh release view "${{ inputs.tag || github.ref_name }}" >/dev/null 2>&1; then
              echo "Черновик релиза найден"
              exit 0
            fi
            echo "Жду, пока tauri-action создаст черновик релиза... ($i/30)"
            sleep 20
          done
          echo "Черновик релиза так и не появился за 10 минут" >&2
          exit 1

      - name: Attach Flatpak to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag || github.ref_name }}" com.roadwits.client.flatpak --clobber
