syntax = "proto3";

package roadwits.v1;

import "google/protobuf/timestamp.proto";

// Заявки в друзья между пользователями: отправка по email, принятие,
// отклонение/удаление, список друзей, лидерборд.
service FriendsService {
  rpc SendRequest(SendFriendRequestRequest) returns (Friendship);
  rpc ListIncoming(ListIncomingRequest) returns (FriendshipList);
  rpc ListOutgoing(ListOutgoingRequest) returns (FriendshipList);
  rpc Accept(AcceptFriendRequestRequest) returns (Friendship);
  // Отклонить входящую заявку, отозвать исходящую или удалить принятую дружбу.
  rpc Remove(RemoveFriendshipRequest) returns (RemoveFriendshipResponse);
  rpc ListFriends(ListFriendsRequest) returns (FriendshipList);
  // Себя + принятых друзей, отсортированные по баллам (сумма правильных
  // ответов из settings.quiz_stats).
  rpc Leaderboard(LeaderboardRequest) returns (LeaderboardResponse);
}

message FriendUser {
  int64 id = 1;
  optional string email = 2;
  optional string first_name = 3;
  optional string last_name = 4;
}

message Friendship {
  int64 id = 1;
  string status = 2; // "pending" | "accepted"
  google.protobuf.Timestamp created_at = 3;
  optional google.protobuf.Timestamp responded_at = 4;
  FriendUser requester = 5;
  FriendUser addressee = 6;
}

message SendFriendRequestRequest {
  string email = 1;
}

message ListIncomingRequest {}
message ListOutgoingRequest {}
message ListFriendsRequest {}

message FriendshipList {
  repeated Friendship friendships = 1;
}

message AcceptFriendRequestRequest {
  int64 friendship_id = 1;
}

message RemoveFriendshipRequest {
  int64 friendship_id = 1;
}

message RemoveFriendshipResponse {}

message LeaderboardRequest {}

message LeaderboardEntry {
  int64 user_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string email = 4;
  optional string profile_photo = 5;
  int32 points = 6;
  bool is_me = 7;
}

message LeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
}
