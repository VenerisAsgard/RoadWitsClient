[package]
name = "roadwits-client"
version = "1.5.7"
description = "Roadwits — клиент для изучения ПДД РБ"
authors = ["VenerisAsgard <dev.va@icloud.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Генерация Rust-кода из .proto (proto/roadwits/v1/*.proto) при сборке —
# см. build.rs и src/grpc/mod.rs.
tonic-build = "0.11"
protoc-bin-vendored = "3"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
# gRPC-клиент к новому серверу (roadwits-rs, tonic) — см. src/grpc/.
# Версии tonic/prost сознательно совпадают с workspace.dependencies самого
# сервера (roadwits-rs/Cargo.toml), хотя это отдельный крейт: формат вызовов
# генерируется из тех же .proto, но версии tonic клиента и сервера не обязаны
# совпадать (это просто протокол gRPC/HTTP2), совпадение здесь — для
# единообразия с проектом сервера, а не по необходимости.
tonic = "0.11"
tonic-health = "0.11"
prost = "0.12"
prost-types = "0.12"
# Только для GrpcChannel::channel() (tokio::sync::OnceCell, см.
# src/grpc/mod.rs) — сам асинхронный рантайм уже поднимает Tauri, здесь
# нужны только типы синхронизации, без rt/rt-multi-thread.
tokio = { version = "1", features = ["sync"] }
# ISO 8601 из google.protobuf.Timestamp (see grpc/convert.rs).
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["v4"] }
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Хранилище fingerprint/token (см. session-хэндлы ниже): сам JSON-файл
# ведёт tauri-plugin-store, а значения в нём — не читаемый текст, а
# AES-256-GCM шифротекст (aes-gcm), ключ для которого не хранится нигде
# на диске, а каждый раз пересчитывается из ID устройства (machine-uid) —
# см. derive_key(). sha2/base64 нужны только для этого: свести machine id
# к ключу фиксированной длины и упаковать nonce+шифротекст в строку.
tauri-plugin-store = "2"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
machine-uid = "0.5"

[lib]
name = "roadwits_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
