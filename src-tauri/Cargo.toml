[package]
name = "roadwits-client"
version = "1.3.4"
description = "Roadwits — клиент для изучения ПДД РБ"
authors = ["VenerisAsgard <dev.va@icloud.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["v4"] }
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Хранилище fingerprint/token (см. session-хэндлы ниже): сам JSON-файл
# ведёт tauri-plugin-store, а значения в нём — не читаемый текст, а
# AES-256-GCM шифротекст (aes-gcm), ключ для которого не хранится нигде
# на диске, а каждый раз пересчитывается из ID устройства (machine-uid) —
# см. derive_key(). sha2/base64 нужны только для этого: свести machine id
# к ключу фиксированной длины и упаковать nonce+шифротекст в строку.
tauri-plugin-store = "2"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
machine-uid = "0.5"

[lib]
name = "roadwits_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
