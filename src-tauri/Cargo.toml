[package]
name = "roadwits-client"
version = "0.1.0"
description = "Roadwits — клиент лицензирования и обучения"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["v4"] }
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
# Self-update: апдейтер проверяет удалённый latest.json (см. endpoints в
# tauri.conf.json), скачивает подписанный билд и ставит его; process нужен
# только для relaunch() после установки — перезапустить приложение самому
# tauri-plugin-updater не может.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[lib]
name = "roadwits_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
