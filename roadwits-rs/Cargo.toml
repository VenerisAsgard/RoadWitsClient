[workspace]
resolver = "2"
members = ["crates/roadwits-proto", "crates/roadwits-server"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tonic = "0.11"
tonic-build = "0.11"
tonic-health = "0.11"
prost = "0.12"
prost-types = "0.12"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "json", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9"
rand = "0.8"
thiserror = "1"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
regex = "1"
